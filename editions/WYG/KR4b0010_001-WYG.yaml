body:
  text: 璇璣圖詩讀法巻上明康萬民撰苻秦武功蘇氏蕙若蘭織錦囘文璇璣圖詩其采式詳讀法内仁智懷德聖虞唐眞妙顯華重榮章臣賢惟聖配英皇倫匹離飄浮江湘津傷嗟情家明葩榮志庭闈亂作人讒奸佞㐫害我忠貞桑㐫慈雍思恭基河慘嘆中無鏡紛為篤明難受消源禍因所恃恣極驕盈榆頑孝和淑自為隔懷懷傷君朗光誰終榮茍不義姬班女婕妤辭輦漢成薄浸休家貞記孝塞慕所路房容珠感誓城傾在戒后孽嬖趙氏飛燕實生景讒退遠敦貞敬殊增離曠幃飭曜思穹熒猶炎盛興漸至大伐用昭青青昭愚謙危節所是山憂經遐清華英多蒼形未在愼㴱慮微察逺禍在防萌西滋䝉疑容持從梁心荒淫忘想感所欽岑幽巖峻嵯峨㴱淵重涯經網羅林光流電逝推生民堂妃闈飛衣誰追何思情時形寒歲識凋松愆居歎如陽移陂施為祗差生空后中奮衮為相如感傷在勞貞物知終始舊獨懷何潛西不何誰神無感惟自節能我容聲將自孜君想顔喪改華容是為女賤曜日日激與通者曠思興厲不歌冶同情寧孜側夢仁賢别行士念誰賤鄙翳白無憤將上採悲詠風樊歎發觀羽纒龍旂容衣詩情明顯怨哀情時傾英殊衰殊身節菲路和周楚長雙華宮憂虎彫飾綉始璇璣圖義年勞歎奇華年有志飭忘葑長音南鄭歌商流徵殷繁華觀曜終始心詩興感遠殊浮沈時盛意麗哀遺身藏邵衞詠齊曜情多文曜壯顔無平蘇氏理往憂歲異浮惟必心華惟下微摧伯女志興榮傷患藻榮麗充端比作麗辭日思慕世異逝倏違榮感體憫悲窈河遐碩翠感生嬰漫丁寃詩風興鹿鳴懷悲哀誰逝倏無一俯憂作已聲窕廣路人粲我艱是漫是何桑翳感孟宣傷感情者頽然盈體仰情者處發淑思逶其葳情惟憂何艱生時盛昭業傾思永戚我流若不忠容何成幽曲姿歸迤頎㽔悲苦懷思苦我章徽恨微𤣥悼歎戚知沙馳虧離儀貲辭房秦王懷土眷舊鄉身加兼愁悴少精神遐幽曠遠離鳳麟龍昭德懷聖皇人商遊桑鳩揚仇傷榮身我乎集殃愆辜何因備嘗苦辛當神飛文遺分歸賤絃西翳雙激好摧君㴱日潤浸愆思罪積怨其根難尋所明輕殊孤乖㕍為激階陰巢水悲容仁均物品育施生天地德貴平均勻專通身粲妾殊翔女楚步林燕情思發離濱漢之步飄飄離微隔喬木誰陰一感寄飭散聲應有流東桃飛泉君歎殊心改者惑暱親聞遠離殊我同衾志精浮光離哀傷柔清廊休翔流長愁方禽伯在誠故遺舊廢故君子惟新貞微雲輝羣悲春剛琴芳蘭凋茂熙陽春牆面殊意感故新霜冰齊潔志清純望誰思想懷所親璇璣圖詩采式四圍仁智之湘津津河之剛親親所之芳琴琴清之傷仁從第八字真志横過由蒼欽欽所逆上之荒心倫桑之西林林光之生民春芳之榮身身鄉之王秦純貞之當麟麟龍之皇人以紅書為第一圖自八行第八字欽岑之羅林林陽横過之沙麟麟鳳逆上之加身身苦横囘之何欽以紅書為第二圖四圍縱横初行八行十五行二十二行二十九行及仁嗟斜至春親琴廊斜至基津以紅書為第三圖以上起宗舊圖説但餘圖有於此圖借字有礙今推縱横初行八行紅書余以紅線界畫即準之讀者審焉自正中行音南之遺身横中行臣奸之舊新斜行仁嗟之春親琴廊之基津以紅書為附增第三圖此圖自唐以來至起宗俱未拈出四隅嗟情之英多遊桑之長愁神飛之悲春㐫慈之持從縱横皆六字以墨書為第四圖以上起宗舊圖說此圖内借字成言亦如第五圖乃起宗獨於此中不相假借何也余推而廣之所得益多實取象於第五圖云正面妃闈至㽔悲移陂至貲辭縱六字横十三字兩旁庭闈之防萌身我之維新縱十三字横六字以靑書為第五圖起宗舊圖説中方正面龍旂之麗充哀情之慕世縱四字横五字兩旁寒歲之行士詩風之微𤣥縱五字横四字以紫書為第六圖起宗舊圖説中方四隅思情之側夢嬰漫之苦我愆居之賤鄙懷悲之戚知縱横皆四字又中縱各五字詩情之顯怨端比之麗辭横各五字詩始之無端怨義之理辭空中心璇璣圖始平蘇氏詩心九字以黄書為第七圖起宗舊圖說讀法一自仁字起順讀每首四句句七言仁智懐徳聖虞唐真妙顯華重榮章臣賢惟聖配英皇倫匹離飄浮江湘真志篤終誓穹蒼欽所感想㤀淫荒心憂増慕懐慘傷志篤終誓穹蒼欽所感想㤀淫荒心憂増慕懐慘傷仁智懐徳聖虞唐欽所感想㤀淫荒心憂増慕懐慘傷仁智懐徳聖虞唐真志篤終誓穹蒼真妙顯華重榮章真妙顯華重榮章臣賢惟聖配英皇倫匹離飄浮江湘津河隔塞殊山梁臣賢惟聖配英皇倫匹離飄浮江湘津河隔塞殊山梁民生感曠悲路長民生推逝電流光倫匹離飄浮江湘津河隔塞殊山梁民生感曠悲路長身微憫已處幽房民生推逝電流光林西昭景薄榆桑以上共詩十首津河之柔剛十首親所之蘭芳十首琴親之慘傷十首三段讀法俱同前各得詩十首右第一圖共詩四十首囘文括入後讀法中新讀無所増讀法二自欽字起順讀每首四句句七言欽岑幽巖峻嵯峨深淵重涯經網羅林陽潛曜翳英華沉浮異逝頽流沙深淵重涯經網羅英華流沙幽遐林陽之兼加沈浮之患多麟鳳之如何神精之嵯峨身苦之網羅殷憂之英華右第二圖共詩八首囘文括入後讀法中新讀無所増讀法三之一自初行退一字成句句七言每首四句以下遞退一句成章智懐徳聖虞唐真妙顯華重榮章臣賢惟聖配英皇倫匹離飄浮江湘津桑榆薄景昭西林奸因女嬖至微湥淵重涯經網羅林識知改别明璣心峨嵯峻巖幽岑欽志篤終誓穹蒼欽岑幽巖峻嵯峨深微至嬖女因奸臣淵重涯經網羅林識知改别明璣心思傷君夢詩璇心璣明别改知識深圖怨念為懐如林詩興感逺殊浮沈氏辭懐感戚知麟蘇作興感昭恨神平端寃是何懐身始終曜觀華繁殷何如將情纒憂殷繁華觀曜終始心多患生艱惟苦身徴流商歌鄭南音所感想㤀淫荒心堂空惟思詠和音憂増慕懐慘傷仁多曜容君中嗟仁傷慘懐慕増憂心智懐徳聖虞唐真以上一段得詩二十二首以下共一十六段讀法俱如上共九十六首詳書新増讀内新増讀法三之一其法於舊讀款式内依前詩讀完餘依凡例増詩法讀去俱為新得者其什浩繁不能備録惟逐段分之其後倣此智懐之湘津讀法俱如前増詩法在凡例内所懐之芳琴河隔之剛親清流之傷仁以上四段遞句退成囘文每段各増詩十六首共六十四首合原讀八十八首總一百五十二首妙顯之梁民生感之望純清志之商秦曲發之唐真以上四段遞句退成囘文每段各増詩十五首共六十首合原讀百首總一百六十首賢惟之長身微憫之霜新故感之藏音和詠之章臣以上四段遞句退成囘文每段各増詩十六首共六十四首合原讀九十六首總一百六十首匹離之房人賤為之牆春陽熙之堂心憂増之皇倫以上四段遞句退成囘文每段各増詩十八首共七十二首合原讀九十六首總一百六十八首讀法三之二自上横行退一字成句以後遞退一句成章傷慘懐慕増憂心堂空惟思詠和音藏摧悲聲發曲秦商弦激楚流清琴王懐土眷舊郷身南鄭歌商流徴殷多患生艱惟苦身繁華觀曜終始心憂纒情將如何欽荒淫㤀想感所欽何如將情纒憂殷徴流商歌鄭南音多患生艱惟苦身繁華觀曜終始心思傷君夣詩璇心始終曜觀華繁殷平端寃是何懐身蘇作興感昭恨神氏辭懐感戚知麟詩興感逺殊浮沈圖怨念為懐如林璣明别改知識深岑幽巖峻嵯峨深識知改别明璣心淵重涯經網羅林微至嬖女因奸臣蒼穹誓終篤志真妙顯華重榮章臣唐虞聖徳懐智仁多曜容君中嗟仁智懐徳聖虞唐真傷慘懐慕増憂心以上一段得詩二十二首以下一十六段讀俱如上詳讀新増之内新増讀法三之二傷慘之清琴讀法俱前芳蘭之所親剛柔之河津湘江之智仁以上四段遞句退成囘文每段各増詩十六首共六十四首合原讀八十八首總一百五十二首堂空之陽春牆面之賤人房幽之匹倫皇英之憂心以上四段遞句退成囘文每段各増詩十五首共六十首合原讀一百首總一百六十首藏摧之故新霜氷之微身長路之賢臣章榮之和音以上四段遞句退成囘文每段各増詩十六首共六十四首合原讀九十六首總一百六十首商弦之清純望誰之生民梁山之妙真唐虞之曲秦以上四段遞句退成囘文每段各増詩十八首共七十二首合原讀九十六首總一百六十八首新増讀法三之三原讀無詩法只有章法故畧其圖不録惟録新増者自兩間行退一字成句以下遞退一句成章又縱横返復讀荒滛之生民王懐之皇人志篤之芳春桑榆之貞純生推之荒心皇聖之王秦方殊之志真貞志之桑倫以上八段遞句退成囘文每段各増詩三十九首共三百一十二首合原讀五百四首總八百一十六首岑幽之長身加兼之剛親何如之故新陽潛之所親羅網之和音鳳離之清琴苦惟之章臣沙流之湘津以上八段遞句退成囘文每段各増詩四十五首共三百六十首合原讀三百七十六首總七百三十六首淵重之房人遐幽之望純多患之清純浮異之牆春以上四段遞句退成囘文每段各増詩三十六首共一百四十四首合原讀三百三十六首總三百八十首繁華之房人識知之清純浮殊之曲秦恨昭之皇倫以上四段遞句退成囘文每段各増詩一百七首共四百二十八首合原讀二百九十六首總七百二十四首詩興之剛親蘇作之所親始終之清琴璣明之湘津以上四段遞句退成囘文每段各増詩五十九首共二百三十六首合原讀一百三十六首總三百七十二首時盛之望純辜罪之賤人徴流之陽春微至之梁民以上四段遞句退成囘文每段各増詩二十八首共一百一十二首合原讀五十六首總一百六十八首新増讀法三之四原讀無詩法故不録自中行退一字成句以下遞退一句成章南鄭之遺身奸因之舊新遺哀之南音舊聞之奸臣峨嵯之曲秦精少之陽春憂纒之皇倫華英之桑民以上八段遞句退成回文每段各増詩五十八首共四百六十四首合原讀四百一十六首總八百八十首光流之剛親龍昭之牆春當所之芳琴榮君之所親鄉舊之故新所感之清琴蒼穹之湘津西昭之長身以上八段遞句退成回文毎段各増詩二十九首共二百三十二首合原讀九十六首總三百二十八首讀法三之五自角斜退一字成句以下遞退一句成章嗟中君容曜多欽思傷君夣詩璇心氏辭懐感戚知麟神輕粲散哀春親龍昭徳懐聖皇人當所專一志貞純沙流頽逝異浮沈鳳離逺曠幽遐神詩興感逺殊浮沈時盛意麗哀遺身華英翳曜潛陽林浮異逝頽流沙麟蘇作興感昭恨神辜罪天離聞舊新遐幽曠逺離鳳麟精少悴愁兼加身圖怨念為懐如林滋謙逺貞自基津西昭景薄榆桑倫光流電逝推生民羅網經涯重淵深陽潛曜翳英華沈平端寃是何懐身傷好水燕桃廊琴榮君仁離殊方春鄉舊眷土懐王秦加兼愁悴少精神苦惟艱生患多殷璣明别改知識深微至嬖女因奸臣淵重涯經網羅林始終曜觀華繁殷多患生艱惟苦身徴流商歌鄭南音岑幽巖峻嵯峨深淵重涯經網羅林光流電逝推生民滋謙逺貞自基津陽潛曜翳英華沈西昭景薄榆桑倫如懐為念怨圖心微至嬖女因奸臣章榮重華顯妙真賢惟聖配英皇倫識知改别明璣心蘇作興感昭恨神氏辭懐感戚知麟平端寃是何懐身詩興感逺殊浮沈始終曜觀華繁殷圖怨念為懐如林璇詩夣君傷思欽何如將情纒憂殷多患生艱惟苦身榮君仁離殊方春加兼愁悴少精神傷好水燕桃廊琴懐何是寃端平心鄉舊眷土懐王秦繁華觀曜終始心詩興感逺殊浮沈圖怨念為懐如林氏辭懐感戚知麟璣明别改知識深蘇作興感昭恨神平端寃是何懐身徴流商歌鄭南音藏摧悲聲發曲秦和詠思惟空堂心蒼穹誓終篤志真唐虞聖徳懐智仁傷慘懐慕増憂心妙顯華重榮章臣賢惟聖配英皇倫奸因女嬖至微深所感想㤀淫荒心堂空惟思詠和音藏摧悲聲發曲秦南鄭歌商流徴殷憂増慕懐慘傷仁智懐徳聖虞唐真嗟中君容曜多欽以上一段得詩五十九首以下共十六段讀法俱如上詳書増讀之内右第三圖共詩三千五百一十八首新増第三圖讀法三之五嗟中之春親詩法讀法俱如上廊桃之基津春哀之嗟仁基自之廊琴以上四段遞句退成囘文每段各増詩五十一首共二百四首合原讀二百三十六首總四百四十首思傷之望純懐何之梁民知戚之憂心如懐之陽春以上四段每段各増詩一百九首共四百三十六首合原讀二百六十四首總七百首氏辭之霜新圖怨之長身璇詩之和音平端之故新以上四段遞句退成囘文每段各増詩七十一首共二百八十四首合原讀一百四首總三百八十八首神輕之牆春滋謙之房人多曜之曲秦傷好之清純以上四段遞句退成囘文每段各増詩一十四首共五十六首合原讀四十八首總一百四首右第三圖原讀詩三千五百一十八首増讀詩三千七百八十八首總七千三百一十六首讀法括入後圖中璇璣圖詩讀法巻上

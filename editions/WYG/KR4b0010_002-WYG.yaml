body:
  text: 璇璣圖詩讀法巻下明康萬民撰附増第三圖讀法一自詩興起於中心一句各頂字倒換互旋八靣分讀七言四句詩興感逺殊浮沈始終曜觀華繁殷蘇作興感昭恨神璣明别改知識深詩興之識深讀法具前始終之恨神璣明之浮沈蘇作之繁殷圖怨之知麟平端之思欽璇詩之如林氏辭之懐身以上四正四隅共得詩八首詩興之懐身氏辭之繁殷蘇作之思欽平端之識深始終之如林璇詩之浮沈璣明之知麟圖怨之恨神以上八面左旋讀得詩八首詩興之思欽圖怨之繁殷璣明之懐身璇詩之恨神始終之知麟平端之浮沈蘇作之如林氏辭之識深以上八面右旋讀得詩八首共二十四首附増第三圖讀法二自詩興頂字兩分四正四隅各倒換互旋分讀七言四句詩興感逺殊浮沉時盛意麗哀遺身始終曜觀華繁殷徴流商歌鄭南音詩興之南音讀法具前始終之遺身璣明之舊新蘇作之奸臣以上四正分讀得詩四首詩興之舊新蘇作之南音始終之識深璣明之浮沈以上四正左旋讀得詩四首詩興之奸臣璣明之南音始終之舊新蘇作之遺身以上四正右旋讀得詩四首璇詩之廊琴平端之春親氏辭之基津圖怨之嗟仁以上四隅左旋讀得詩四首璇詩之基津圖怨之春親氏辭之廊琴平端之嗟仁以上四隅右旋讀得詩四首詩興之廊琴蘇作之嗟仁始終之基津璣明之春親以上一正間一隅左旋讀得詩四首詩興之嗟仁璣明之廊琴始終之春親蘇作之基津以上一正間一隅右旋讀得詩四首氏辭之南音平端之奸臣璇詩之遺身圖怨之舊新以上一隅間一正左旋讀得詩四首氏辭之奸臣圖怨之南音璇詩之舊新平端之遺身以上一隅間一正右旋讀得詩四首詩興之春親氏辭之舊新蘇作之廊琴平端之南音始終之嗟仁璇詩之奸臣璣明之基津圖怨之遺身以上八靣左旋讀得詩八首詩興之基津圖怨之奸臣璣明之嗟仁璇詩之南音始終之廊琴平端之舊新蘇作之春親氏辭之遺身以上八靣右旋讀得詩八首共五十二首并前二十四首總七十六首附増第三圖讀法三自中行退一字於八靣俱只取一句顛倒回文七言四句南鄭歌商流徵殷廊桃燕水好傷身舊聞離天罪辜神春哀散粲輕神麟南鄭之神麟讀法具前廊桃之時沈舊聞之滋林春哀之徵深遺哀之多欽基自之微殷奸因之傷身嗟中之辜神以上八面左旋讀得詩八首南鄭之滋林嗟中之時沈奸因之神麟基自之辜神遺哀之傷身春哀之徴殷舊聞之多欽廊桃之㣲深以上八靣右旋讀得詩八首自中行四正靣間讀各取一句顛倒囘文七言四句南鄭歌商流徴殷舊聞離天罪辜神遺哀意麗盛時沈奸因女嬖至㣲深南鄭之㣲深讀法具前舊聞之徴殷遺哀之辜神奸因之時沉以上四正左旋讀得詩四首南鄭之辜神奸因之徴殷遺哀之㣲深舊聞之時沈以上四正右旋讀得詩四首自四隅嗟中起如四正讀法嗟中之滋林廊桃之多欽春哀之傷身基自之神麟以上四隅左旋讀得詩四首嗟中之傷身基自之多欽春哀之滋林廊桃之神麟以上四隅右旋讀得詩四首自南鄭一正一隅各間一句分讀法南鄭歌商流徴殷舊聞離天罪辜神廊桃燕水好傷身春哀散粲輕神麟南鄭之神麟讀法具前廊桃之時沈舊聞之滋林春哀之㣲深遺哀之多欽基自之徴殷佞因之傷身嗟中之辜神以上八靣一正一隅各間一句左旋讀得詩八首南鄭之滋林嗟中之時沈奸因之神麟基自之辜神遺哀之傷身春哀之徴殷舊聞之多欽廊桃之㣲深以上一正一隅各間一句右旋讀得詩八首自南鄭只用正靣一句餘用三隅三句讀七言四句南鄭歌商流徴殷廊桃燕水好傷身春哀散粲輕神麟基自貞遠謙滋林南鄭之滋林讀法具前舊聞之多欽遺哀之傷身奸因之神麟以上左旋讀得詩四首南鄭之神麟奸因之傷身遺哀之多欽舊聞之滋林以上右旋讀得詩四首自嗟仁斜行只用一句餘用三正靣三句讀七言四句嗟仁之時沉廊桃之㣲深春哀之徴殷基自之辜神以上左旋讀得詩四首嗟仁之辜神基自之微殷春哀之徴深廊桃之時沈以上右旋讀得詩四首共得詩六十四首右附増第三圖共得詩一百四十首讀法四自嗟字起反覆讀亦可分讀嗟歎懐所離經遐曠路傷中情家無君房幃清華飭容朗鏡明葩紛光珠曜英多思感誰為榮嗟歎之為榮讀法具前榮為之歎嗟經離之思多多思之離經三言十二句四首懐歎嗟所離經路曠遐傷中情君無家房幃清容飭華朗鏡明光紛葩珠曜英感思多誰為榮懐歎之為榮讀法具前誰為之歎嗟所離之思多感思之離經三言十二句四首嗟歎懐傷中情家無君朗鏡明葩紛光誰為榮嗟歎之為榮讀法具前榮為之歎嗟經離之思多多思之離經三言六句四首懐歎嗟傷中情君無家朗鏡明光紛葩誰為榮懐歎之為榮讀法具前誰為之歎嗟所離之思多感思之離經三言六句四首共一十六首遊西之摧傷凶頑之爲基神明之雁歸三段讀法俱同前以上四段毎段各得詩一十六首右第四圖共詩六十四首新増讀法四自嗟字起兩分讀或間一句羅文互用分讀作三言或借一字作四言借二字作五言如第五圖讀法懐歎嗟傷中情君無家朗鏡明光紛葩誰為榮懐歎之為榮讀法具前誰為之歎嗟所離之思多感思之離經三言六句四首嗟歎懷路曠遐家無君容飾華葩紛光感思多嗟歎之思多讀法具前榮為之離經經離之為榮多思之歎嗟三言六句四首懐歎嗟路曠遐家無君容飭華光紛葩感思多懐歎之思多讀法具前所離之為榮誰為之離經感思之歎嗟三言六句四首懐所離經傷路曠遐君房幃清朗容飭華光珠曜英誰感思多懐所之思多誰感之離經所懐之為榮感誰之歎嗟右兩分各借一字互用分讀四言六句四首懐所離經路傷中情君房幃清容朗鏡明光珠曜英感誰為榮懐所之為榮讀法具前誰感之歎嗟所懐之思多感誰之離經右兩分各借一字間一句羅互分讀四言六句四首歎懐所離經中傷路曠遐無君房幃清鏡朗容飭華紛光珠曜英為誰感思多歎懐之思多讀法具前為誰之離經離所之為榮思感之歎嗟右兩分各借二字互用分讀五言六句四首歎懐所離經曠路傷中情無君房幃清飭容朗鏡明紛光珠曜英思感誰為榮歎懐之為榮讀法具前為誰之歎嗟離所之思多思感之離經右兩分各借二字間一句互用分讀五言六句四首階西之摧傷浸頑之為基通明之雁歸三段讀法俱同前右四段每段各増詩二十八首合原讀六十四首總一百七十六首讀法五自中行各借一字互用分讀四言成句亦可六言左右分讀法邵南周風興自后妃衞鄭楚樊厲節中闈詠歌長歎不能奮飛齊商雙發歌我袞衣曜流華觀冶容為誰情徴宫羽同聲相追邵南之相追讀法具前情徴之后妃周南之情悲宫徴之淑姿四言十二句四首周風興自后妃楚樊厲節中闈長歎不能奮飛雙發歌我袞衣華觀冶容為誰宫羽同聲相追周風之相追讀法具前宮羽之后妃邵伯之情悲情傷之淑姿六言六句四首周風興自后妃邵伯窈窕淑姿楚樊厲節中闈衞女河廣思歸長歎不能奮飛詠志遐路逶迤雙發歌我袞衣齊興碩人其頎華觀冶容為誰曜榮翠粲葳蕤宫羽同聲相追情傷感我情悲周風之情悲讀法具前情傷之后妃邵伯之相追宫羽之淑姿六言十二句四首邵伯窈窕淑姿周風興自后妃楚樊厲節中闈衞女河廣思歸詠志遐路逶迤長歎不能奮飛雙發歌我袞衣齊興碩人其頎曜榮翠粲葳蕤華觀冶容為誰宫羽同聲相追情傷感我情悲邵伯之情悲讀法具前情傷之淑姿周風之相追宫羽之后妃六言十二句四首惟時之成辭奸佞之防萌何辜之惟新三段讀法俱同前以上四段每段各得詩十六首右第五圖共詩六十四首新増讀法五各取兩邊四字成句或兩分或間隔一句羅互為四言六言分讀法興自后妃厲節中闈不能奮飛歌我袞衣冶容為誰同聲相追興自之相追讀法具前同聲之后妃窈窕之情悲感我之淑姿四言六句四首興自后妃窈窕淑姿厲節中闈河廣思歸不能奮飛遐路逶迤歌我衮衣碩人其頎冶容為誰翠粲葳蕤同聲相追感我情悲興自之情悲讀法具前同聲之淑姿窈窕之相追感我之后妃四言十二句四首興自后妃窈窕淑姿河廣思歸厲節中闈不能奮飛遐路逶迤碩人其頎歌我衮衣冶容為誰翠粲葳蕤感我情悲同聲相追興自之相追讀法具前感我之淑姿同聲之后妃窈窕之情悲四言十二句四首興自后妃河廣思歸不能奮飛碩人其頎冶容為誰感我情悲興自之情悲讀法具前同聲之淑姿窈窕之相追感我之后妃兩邊分讀左右遞退四言六句四首周風興自后妃衞女河廣思歸長歎不能奮飛齊興碩人其頎華觀冶容為誰情傷感我情悲周風之情悲讀法具前宫羽之淑姿邵伯之相追情傷之后妃兩邊分讀左右遞退六言六句四首白日之成辭作辭之防萌集乎之惟新三段讀法俱同前以上四段每段各増詩二十首共八十首合原讀六十四首總一百四十四首讀法六自寒歳五言反覆讀寒歳識凋松貞物知終始顔䘮改華容仁賢别行士寒歳之行士讀法具前士行之歳寒松凋之賢仁仁賢之凋松五言四句四首寒歳識凋松始終知物貞顔䘮改華容士行别賢仁寒歳之賢仁讀法具前仁賢之歳寒松凋之行士士行之凋松五言四句四首詩風之微𤣥一段讀法俱同前以上二段每段各得詩八首龍虎繁文藻榮曜華彫旂容飭觀壯麗充顔曜綉衣龍虎之綉衣讀法具前衣綉之虎龍五言四句二首藻文繁虎龍榮曜華彫旂麗壯觀飭容充顔曜綉衣藻文之綉衣讀法具前充顔之虎龍五言四句二首哀年之竒傾一段讀法俱同前以上二段每段各得詩四首右第六圖共詩二十四首新増讀法六自寒歲五言從外讀入從内讀出寒歲識凋松仁賢別行士顔喪改華容貞物知終始寒歲之終始讀法具前仁賢之華容松凋之物貞士行之喪顔從外讀入五言四句四首貞物知始終顔喪改華容仁賢別行士寒歲識凋松貞物之凋松讀法具前顔喪之行士始終之歲寒容華之賢仁從内讀出五言四句四首詩風之孔宣一段讀法俱同前以上二段每段各增詩八首龍虎繁文藻旂彫華曜榮容飭觀壯麗衣綉曜顔充五言四句一首藻文繁虎龍充顔曜綉衣麗壯觀飭容榮曜華彫旂藻文之彫旂讀法具前充顔之飭容從外讀入五言四句二首榮曜華彫旂麗壯觀飭容充顔曜綉衣藻文繁虎龍榮曜之虎龍讀法具前麗壯之綉衣從内讀出五言四句二首哀年之異世一段讀法俱同前以上二段每段各增詩五首共二十六首合原讀二十四首總五十首讀法七自思感四言反覆讀中段四言亦可作五言思感自寧孜孜傷情時在君側夢想勞形思感之勞形讀法具前形勞之感思四言四句二首寧自感思孜孜傷情側君在時夢想勞形寧自之勞形讀法具前夢想之感思四言四句二首愆舊之何如嬰是之何寃懷傷之者誰三段讀法俱同前以上四段每段各得詩四首共一十六首詩情明顯怨義興理麗辭作比端無終始詩情之終始讀法具前始終之情詩辭麗之興理興理之麗辭情明之始詩麗作之理辭無終之比端義興之顯怨顯明之義怨比作之無端四言四句十首詩情明顯怨怨義興理辭辭麗作比端端無終始詩詩情之始詩詩始之情詩辭麗之理辭辭理之麗辭端比之無端怨顯之義怨端無之比端怨義之顯怨五言四句八首以上一段得詩一十八首右第七圖共詩三十四首通共得詩三千七百五十二首新増讀法七自寧自作四言從外讀入從内讀出又於中央空方四方一段囘環互搭讀寧自感思夣想勞形側君在時孜孜傷情寧自之傷情讀法具前夣想之在時從外讀入四言四句二首孜孜傷情側君在時夣想勞形寧自感思孜孜之感思讀法具前側君之勞形從内讀出四言四句二首孜孜傷情寧自感思夣想勞形側君在時孜孜之在時讀法具前側君之傷情從下句間逓讀四言四句二首念是之獨居懐憂之漫漫悼思之感悲三段讀法俱同前以上四段毎段各増詩六首共二十四首詩情明顯麗辭作比端無終始怨義興理理興義怨比作麗辭始終無端顯明情詩端無終始怨義興理詩情明顯麗辭作比比作麗辭詩情明顯理興義怨始終無端辭麗作比怨義興理詩情明顯端無終始始終無端顯明情詩理興義怨比作麗辭怨義興理端無終始詩情明顯辭麗作比比作麗辭始終無端顯明情詩理興義怨右中央空心一方四言四句八首以上五段共増詩三十二首合原讀三十四首總六十六首右七圖并附増一圖共八圖新増詩四千二百六首合原讀三千七百五十二首共七千九百五十八首璇璣圖詩讀法巻下
